server {
    listen 80;
    server_name _;

    # ── Security Headers ────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;

    # ── Gzip Compression ────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # ── Frontend (React SPA) ────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── API Proxy ───────────────────────────────────────
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # File upload size (matches Spring config)
        client_max_body_size 5M;
    }

    # ── Actuator / Health Check ─────────────────────────
    location /actuator/health {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Swagger UI (dev/staging only — disable in prod) ─
    location /swagger-ui/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }
}
