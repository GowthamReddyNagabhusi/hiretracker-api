# ============================================================
# HireTrack API — Docker Compose (Development)
# ============================================================
# Usage:
#   1. Copy .env.example to .env and fill in values
#   2. Run: docker compose up -d
#   3. App: http://localhost:8080
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: hiretrack-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hiretrackdb}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hiretrack-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiretrack-app
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/hiretrackdb}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?DB password must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      FILE_UPLOAD_DIR: /app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hiretrack-network
    volumes:
      - app_uploads:/app/uploads
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  app_uploads:
    driver: local

networks:
  hiretrack-network:
    driver: bridge