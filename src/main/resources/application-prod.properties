# ============================================================
# HireTrack API — Production Profile Overrides
# ============================================================
# Activated via SPRING_PROFILES_ACTIVE=prod
# Overrides base application.properties with production-safe values.
# ============================================================

# Database
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Connection Pool — tuned for production load
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10

# Logging — structured, no debug noise
logging.level.root=WARN
logging.level.com.hiretrack=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Actuator — expose only safe endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# OpenAPI — disable in production (security)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
