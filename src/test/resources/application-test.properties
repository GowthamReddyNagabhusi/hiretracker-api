# ============================================================
# HireTrack API — Test Configuration
# ============================================================
# Used by tests (activated via @ActiveProfiles("test"))
# Uses H2 in-memory database — no MySQL required.
# ============================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway for tests (use JPA auto-DDL instead)
spring.flyway.enabled=false

# JWT
jwt.secret=test-secret-key-minimum-32-characters-for-hmac-sha256-testing
jwt.expiration=900000
jwt.refresh-expiration=604800000

# File Upload
file.upload.dir=target/test-uploads

# CORS
cors.allowed-origins=http://localhost:5173

# Actuator
management.endpoints.web.exposure.include=health

# Logging — quiet for tests
logging.level.root=WARN
logging.level.com.hiretrack=INFO
